<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout — Orbit Store</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px;
    font: 15px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #f0f2f5; color: #1c1e21;
  }
  .card {
    background: #fff; border: 1px solid #dfe3e8; border-radius: 10px;
    padding: 24px; max-width: 560px; margin: 0 auto 28px;
    position: relative;
  }
  h1 { font-size: 22px; margin: 0 0 20px; }
  h2 { font-size: 16px; margin: 0 0 16px; }
  label { display: block; font-size: 13px; color: #606770; margin-bottom: 5px; }
  .field { margin-bottom: 16px; }
  input[type=text], input[type=email] {
    width: 100%; padding: 9px 11px; border: 1px solid #ccd0d5;
    border-radius: 6px; font-size: 14px;
  }
  button {
    background: #1877f2; color: #fff; border: 0; border-radius: 6px;
    padding: 11px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .muted { color: #606770; font-size: 13px; }
  .row { display: flex; gap: 16px; }
  .row .field { flex: 1; }
  .total-row { display: flex; justify-content: space-between; padding: 10px 0; }
  .total-row.grand { border-top: 1px solid #dfe3e8; font-weight: 700; }

  /* BUG 1 — the submit button is absolutely positioned and lands on top of the
     terms text instead of below it. */
  #place-order { position: absolute; bottom: 18px; right: 24px; }
  #terms-text { max-width: 330px; margin-top: 8px; }

  /* BUG 2 — a long unbroken order reference overflows its fixed-width box. */
  #order-ref {
    width: 190px; border: 1px solid #ccd0d5; border-radius: 6px;
    padding: 8px 10px; background: #fafbfc; white-space: nowrap;
    font-family: ui-monospace, Menlo, monospace; font-size: 13px;
  }

  /* BUG 3 — the grand total is white on white and cannot be read. */
  #grand-total-value { color: #ffffff; }

  /* BUG 4 — this one field is indented relative to every other field. */
  #postcode-field { margin-left: 34px; }

  /* BUG 5 — the promo button is pushed outside its card. */
  #promo-apply { position: relative; left: 150px; }
</style>
</head>
<body>

<div class="card">
  <h1>Checkout</h1>

  <div class="row">
    <div class="field">
      <label for="first-name">First name</label>
      <input type="text" id="first-name" value="Ada">
    </div>
    <div class="field">
      <label for="last-name">Last name</label>
      <input type="text" id="last-name" value="Lovelace">
    </div>
  </div>

  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" value="ada@example.com">
  </div>

  <div class="field">
    <label for="address">Address</label>
    <input type="text" id="address" value="12 Analytical Way">
  </div>

  <div class="field" id="postcode-field">
    <label for="postcode">Postcode</label>
    <input type="text" id="postcode" value="SW1A 1AA">
  </div>

  <div class="field">
    <label>Order reference</label>
    <div id="order-ref">ORD-2026-0825-AX99-QZ41-KKD8813-RETRY</div>
  </div>
</div>

<div class="card">
  <h2>Promo code</h2>
  <div class="row" style="align-items: flex-end;">
    <div class="field" style="margin-bottom:0;">
      <label for="promo">Have a code?</label>
      <input type="text" id="promo" value="">
    </div>
    <button id="promo-apply">Apply</button>
  </div>
</div>

<div class="card">
  <h2>Order summary</h2>
  <div class="total-row"><span>Subtotal</span><span>£240.00</span></div>
  <div class="total-row"><span>Delivery</span><span>£4.99</span></div>
  <div class="total-row grand">
    <span>Total to pay</span>
    <span id="grand-total-value">£244.99</span>
  </div>

  <p class="muted" id="terms-text">
    By placing this order you agree to the Orbit Store terms of sale and confirm
    that the delivery details above are correct.
  </p>

  <button id="place-order">Place order</button>
</div>

</body>
</html>
